<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyNest Worksheet</title><link rel="stylesheet" href="../../../engine/study-engine-v1.css"><link rel="stylesheet" href="../../../../styles/brand-refresh.css">
</head><body><div class="top-strip">StudyNest Interactive Worksheet</div><main class="app-shell"><section class="screen active" id="welcome"><div class="hero-card"><p class="eyebrow" id="ws-kicker"></p><h1 id="ws-title"></h1><p class="hero-copy" id="ws-description"></p><span class="level-badge" id="ws-level"></span></div><div class="welcome-grid"><div class="info-card"><span class="info-icon">Q</span><div><strong id="ws-count"></strong><p>Interactive practice</p></div></div><div class="info-card"><span class="info-icon">⏱</span><div><strong id="ws-time"></strong><p>Suggested time</p></div></div><div class="info-card"><span class="info-icon">✓</span><div><strong id="ws-skills"></strong><p>Skills covered</p></div></div></div><section class="coverage-card"><h2>What you will practise</h2><div class="topic-chips" id="topic-chips"></div><div class="convention-note" id="ws-note"></div></section><button class="primary-button start-button" id="start">Start worksheet →</button></section><section class="screen" id="quiz"><header class="quiz-header"><div><p class="eyebrow" id="section-label"></p><h2 id="question-counter"></h2></div><span class="score-pill" id="answered-count"></span></header><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div><article class="question-card"><div class="question-topline"><span class="question-number" id="question-number"></span><span class="skill-tag" id="skill-tag"></span></div><h3 id="question-text"></h3><p class="question-instruction" id="question-instruction"></p><div id="answer-area"></div><div class="feedback-box" id="feedback"></div><div class="support-box hint-box" id="hint-box"></div><div class="support-box solution-box" id="solution-box"></div><div class="question-actions"><button class="text-button" id="hint">Show hint</button><button class="secondary-button" id="solution">Worked solution</button><button class="primary-button" id="check">Check answer</button></div></article><div class="navigation-row"><button class="secondary-button" id="prev">← Previous</button><button class="primary-button" id="next">Next question →</button></div></section><section class="screen" id="review"><div class="review-panel"><p class="eyebrow" style="color:var(--accent)">REVIEW</p><h1>Review your answers</h1><p class="review-copy" id="review-copy"></p><div class="review-grid" id="review-grid"></div><div class="review-actions"><button class="secondary-button" id="back-quiz">Continue working</button><button class="primary-button" id="finish">Finish worksheet</button></div></div></section><section class="screen" id="results"><div class="results-hero"><div class="result-ring"><span id="result-percent"></span></div><h1>Worksheet complete</h1><p id="result-message"></p><strong id="result-score"></strong></div><div class="results-grid"><article class="result-card"><h2>Strong areas</h2><div class="result-list" id="strengths"></div></article><article class="result-card review-card"><h2>Review next</h2><div class="result-list" id="review-list"></div></article></div><div class="results-actions"><a class="secondary-button" href="../../geometry.html" style="text-decoration:none">← Variation worksheets</a><button class="primary-button" id="retry">Retry worksheet</button></div></section></main><script src="questions.js"></script><script src="../../../engine/study-engine-v1.js"></script><script src="../../../../scripts/brand-refresh.js"></script>
</body></html>
